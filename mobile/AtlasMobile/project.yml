name: AtlasMobile
options:
  bundleIdPrefix: com.cornwell.atlas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
    SWIFT_OBJC_BRIDGING_HEADER: AtlasMobile/AtlasMobile-Bridging-Header.h
    USER_HEADER_SEARCH_PATHS: "$(SRCROOT)/AtlasMobile/Calibration $(SRCROOT)/AtlasMobile/Export"

targets:
  AtlasMobile:
    type: application
    platform: iOS
    sources:
      - path: AtlasMobile
        excludes:
          - "**/*.xcodeproj"
    info:
      path: AtlasMobile/Info.plist
      properties:
        NSCameraUsageDescription: "ATLAS Mobile uses the camera and LiDAR sensor for 3D scene capture."
        NSLocalNetworkUsageDescription: "ATLAS Mobile connects to Insta360 cameras over the local network."
        NSBonjourServices:
          - "_insta360._tcp"
        UIRequiredDeviceCapabilities:
          - arkit
          - lidar
        CFBundleDisplayName: "ATLAS"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cornwell.atlas.AtlasMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    dependencies:
      # opencv2 goes first. INSCoreMedia.framework (Insta360 SDK) contains
      # and exports its own OpenCV 4.7.0, and the linker binds each symbol
      # to the first library on the link line that defines it. With
      # opencv2 listed after INSCoreMedia, part of the app's OpenCV 5 calls
      # were bound to OpenCV 4.7 functions, which read cv::Mat at other
      # offsets, and rig calibration crashed (SIGBUS in cv::Mat::setTo).
      # RigCalibratorBridge.openCVLinkedFromApp checks this at run time.
      - framework: Frameworks/opencv2.framework
        embed: false
      - framework: Frameworks/INSCameraSDK.xcframework
        embed: true
      - framework: Frameworks/INSCameraServiceSDK.xcframework
        embed: true
      - framework: Frameworks/INSCoreMedia.xcframework
        embed: true
      - framework: Frameworks/SSZipArchive.xcframework
        embed: true
      - sdk: ARKit.framework
      - sdk: CoreML.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: Accelerate.framework

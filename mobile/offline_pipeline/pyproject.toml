[project]
name = "atlas-mobile-offline"
version = "0.1.0"
description = "Offline enhancement pipeline for Atlas Mobile capture sessions"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "open3d>=0.18",
    "scipy>=1.11",
    "torch>=2.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
